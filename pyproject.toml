# Repository-wide Python tooling (services are deployed separately; see each requirements.txt)
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["frontend", "**/node_modules", "*.md"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are handled by the formatter; SQL strings may exceed
    "B008",   # FastAPI's Depends()/Query() defaults are idiomatic
    "UP007",  # Optional[...] kept in API models for readability
    "UP045",
    "UP042",  # str+Enum kept: SQLAlchemy persists the role enum by value
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "app", "ingestion", "insights", "scraper", "tasks"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E402"]
"**/tests/**" = ["B011"]
"services/ingestion-worker/scraper/settings.py" = ["E402"]
