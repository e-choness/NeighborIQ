services:
  postgres:
    # PostGIS image required for Phase 2A (CREATE EXTENSION postgis)
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_DB: house_discovery
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neighbor_iq_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d house_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - neighbor_iq_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - neighbor_iq_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # One-shot: owns the schema. Every service that touches Postgres waits for it.
  migrate:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - neighbor_iq_net

  # One-shot: loads rent benchmarks + synthetic demo listings on first start only.
  bootstrap:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    command: ["python", "-m", "ingestion", "bootstrap", "--if-empty"]
    environment:
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - neighbor_iq_net

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - HOUSE_SERVICE_URL=http://house-api-service:8000
      - SEARCH_SERVICE_URL=http://search-service:8000
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8000
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8000
      - SCRAPER_SERVICE_URL=http://scraper-service:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost,http://frontend:80
    depends_on:
      auth-service:
        condition: service_started
      house-api-service:
        condition: service_started
      search-service:
        condition: service_started
    networks:
      - neighbor_iq_net

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - AUTO_CREATE_SCHEMA=0  # schema is owned by the migrate service
      # Comma-separated emails that sign up with role=admin (operator bootstrap)
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Browsers treat http://localhost as a secure context; set 0 only for plain-http non-localhost hosts
      - SECURE_COOKIES=${SECURE_COOKIES:-1}
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  house-api-service:
    build:
      context: .
      dockerfile: services/house-api-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - AUTO_CREATE_SCHEMA=0  # schema is owned by the migrate service
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - AUTO_CREATE_SCHEMA=0  # schema is owned by the migrate service
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  test-portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    command: ["pytest", "-v"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  test-api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    command: ["pytest"]
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  test-auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    command: ["pytest"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
      - SECURE_COOKIES=0
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  test-house-api-service:
    build:
      context: .
      dockerfile: services/house-api-service/Dockerfile
    command: ["pytest"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  test-search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    command: ["pytest"]
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  ai-insights-service:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
      - CELERY_BROKER_URL=redis://redis:6379/2
      - NARRATIVE_PROVIDER=local
      - MODEL_PATH=/app/models/price_prediction.joblib
      # Show XGBoost estimates next to comps only once backtest metrics are acceptable
      - ML_PREDICTIONS_ENABLED=${ML_PREDICTIONS_ENABLED:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  ai-insights-worker:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "-Q", "insights,narratives"]
    environment:
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
      - CELERY_BROKER_URL=redis://redis:6379/2
      - NARRATIVE_PROVIDER=local
      - MODEL_PATH=/app/models/price_prediction.joblib
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ai_models:/app/models  # retrained model survives restarts
    networks:
      - neighbor_iq_net

  ai-insights-beat:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  test-ai-insights-service:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    command: ["pytest", "-v"]
    environment:
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
      - CELERY_BROKER_URL=redis://redis:6379/2
      - NARRATIVE_PROVIDER=local
      - MODEL_PATH=/app/models/price_prediction.joblib
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  test-data-layer:
    build:
      context: .
      dockerfile: services/test-data-layer/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/house_discovery
      - REDIS_URL=redis://redis:6379/1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  # ---------------------------------------------------------------------------
  # Phase 4: Scraper Service
  # ---------------------------------------------------------------------------

  scraper-service:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    # No host port: reachable only through api-gateway, which strips client X-User-* headers
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  scraper-worker:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "-Q", "scraper"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
      - SCRAPER_DATABASE_URL=postgresql://root:root@postgres:5432/house_discovery
      - SCRAPY_SETTINGS_MODULE=scraper.settings
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  scraper-beat:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neighbor_iq_net

  test-scraper-service:
    build:
      context: .
      dockerfile: services/scraper-service/Dockerfile
    command: ["pytest", "-v"]
    profiles: ["test"]
    networks:
      - neighbor_iq_net

  # ---------------------------------------------------------------------------
  # Phase 6: Vue 3 Frontend
  # ---------------------------------------------------------------------------

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - neighbor_iq_net

  test-frontend-build:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["test"]
    command: ["nginx", "-t"]
    networks:
      - neighbor_iq_net

networks:
  neighbor_iq_net:
    driver: bridge

volumes:
  postgres_data:
  ai_models:
