# NeighborIQ — local stack
#
#   docker compose up -d                       # api + workers + frontend on http://localhost
#   docker compose --profile test up --abort-on-container-exit   # test containers
#
# Deployables (see docs/architecture/overview.md):
#   api              — the single HTTP service (auth, listings, portfolio, insights, admin)
#   ingestion-worker — Celery: seed, open data, OSM, partner feeds    (scales independently)
#   insights-worker  — Celery: yields, ML, narratives                  (scales independently)
#   *-beat           — one scheduler per worker queue
#   migrate/bootstrap — one-shot: schema (Alembic), then first-run data
#
# Secrets: copy .env.example to .env and change them before any shared deployment.

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-house_discovery}
  CELERY_BROKER_URL: redis://redis:6379/2
  REDIS_URL: redis://redis:6379/0

x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-house_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "127.0.0.1:5432:5432"  # localhost only, for psql during development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [neighbor_iq_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks: [neighbor_iq_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: owns the schema. Everything that touches Postgres waits for it.
  migrate:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [neighbor_iq_net]

  # One-shot: rent benchmarks + synthetic demo listings, on first start only.
  bootstrap:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    command: ["python", "-m", "ingestion", "bootstrap", "--if-empty"]
    environment: *db-env
    depends_on: *after-migrate
    restart: "no"
    networks: [neighbor_iq_net]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # Swagger at http://localhost:8000/docs; browsers use the frontend proxy
    environment:
      <<: *db-env
      AUTO_CREATE_SCHEMA: "0"  # schema is owned by the migrate service
      CORS_ORIGINS: http://localhost:5173,http://localhost
      # Comma-separated emails that sign up with role=admin (operator bootstrap)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Browsers treat http://localhost as a secure context; set 0 only for plain-http non-localhost hosts
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
      # Production: provide PEM keys from your secret store (dev generates and stores a pair)
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      FEED_ALLOWED_HOSTS: ${FEED_ALLOWED_HOSTS:-}
      # Show XGBoost estimates next to comps only once backtest metrics are acceptable
      ML_PREDICTIONS_ENABLED: ${ML_PREDICTIONS_ENABLED:-0}
    depends_on: *after-migrate
    networks: [neighbor_iq_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      <<: *db-env
      SCRAPY_SETTINGS_MODULE: scraper.settings
      LISTING_FEED_URL: ${LISTING_FEED_URL:-}
    volumes:
      - opendata_cache:/app/data/cache  # downloaded open-data files
    depends_on: *after-migrate
    networks: [neighbor_iq_net]

  ingestion-beat:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    environment: *db-env
    depends_on: *after-migrate
    networks: [neighbor_iq_net]

  insights-worker:
    build:
      context: .
      dockerfile: services/insights-worker/Dockerfile
    environment:
      <<: *db-env
      NARRATIVE_PROVIDER: ${NARRATIVE_PROVIDER:-local}
      MODEL_PATH: /app/models/price_prediction.joblib
    volumes:
      - ai_models:/app/models  # retrained model survives restarts
    depends_on: *after-migrate
    networks: [neighbor_iq_net]

  insights-beat:
    build:
      context: .
      dockerfile: services/insights-worker/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "beat", "--loglevel=info"]
    environment: *db-env
    depends_on: *after-migrate
    networks: [neighbor_iq_net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks: [neighbor_iq_net]

  # ---------------------------------------------------------------------------
  # Tests: docker compose --profile test up --abort-on-container-exit
  # ---------------------------------------------------------------------------
  test-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["pytest", "-v"]
    environment:
      <<: *db-env
      SECURE_COOKIES: "0"
    depends_on: *after-migrate
    profiles: ["test"]
    networks: [neighbor_iq_net]

  test-ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    command: ["pytest", "-v"]
    environment: *db-env
    depends_on: *after-migrate
    profiles: ["test"]
    networks: [neighbor_iq_net]

  test-insights-worker:
    build:
      context: .
      dockerfile: services/insights-worker/Dockerfile
    command: ["pytest", "-v"]
    environment: *db-env
    depends_on: *after-migrate
    profiles: ["test"]
    networks: [neighbor_iq_net]

  test-data-layer:
    build:
      context: .
      dockerfile: services/test-data-layer/Dockerfile
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379/1
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/neighboriq_migration_test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["test"]
    networks: [neighbor_iq_net]

  test-frontend-build:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: builder
    command: ["npm", "run", "build"]
    profiles: ["test"]
    networks: [neighbor_iq_net]

networks:
  neighbor_iq_net:
    driver: bridge

volumes:
  postgres_data:
  ai_models:
  opendata_cache:
