# Production overlay
#
#   DOMAIN=neighboriq.example docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires a .env with real secrets (see .env.example). Caddy obtains and renews
# TLS certificates automatically once DNS for $DOMAIN points at this host.

x-restart: &restart
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks: [neighbor_iq_net]

  frontend:
    <<: *restart
    ports: !reset []  # only Caddy is public

  postgres:
    <<: *restart
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis:
    <<: *restart
    ports: !reset []
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    <<: *restart
    ports: !reset []
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY (PEM)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY (PEM)}

  ingestion-worker: *restart
  ingestion-beat: *restart
  insights-worker: *restart
  insights-beat: *restart

volumes:
  redis_data:
  caddy_data:
  caddy_config:
