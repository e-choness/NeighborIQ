# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/shared", "/services/api", "/services/ingestion-worker", "/services/insights-worker"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
    groups:
      docs: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/services/api", "/services/ingestion-worker", "/services/insights-worker", "/frontend"]
    schedule: { interval: monthly }
