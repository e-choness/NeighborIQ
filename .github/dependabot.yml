# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
# "/" covers requirements-dev.txt (CI tooling: Ruff, pip-audit). @fontsource/* rides the frontend group.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/shared", "/shared/tests", "/services/api", "/services/ingestion-worker", "/services/insights-worker"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
    ignore:
      # kombu (Celery's transport) requires redis-py < 6.5 — still true in kombu 5.6.2; re-check 2026-12
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
    ignore:
      # TypeScript 7 is the native compiler; vue-tsc can't drive it yet — re-check 2026-12
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types track the runtime (Node 24 LTS); bump together with the Node image — re-check at Node 26 LTS (2026-10)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
    groups:
      docs: { patterns: ["*"] }
    ignore:
      # vitepress-plugin-mermaid supports mermaid 10 and 11 only — re-check 2026-12
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
  # Actions are pinned to commit SHAs (tags can be moved, as in the 2026 trivy-action compromise);
  # Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/services/api", "/services/ingestion-worker", "/services/insights-worker", "/frontend", "/shared/tests"]
    schedule: { interval: weekly }
    ignore:
      # Node: LTS lines only (even majors); move to the next LTS deliberately — re-check 2026-10
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
