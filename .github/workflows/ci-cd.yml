# CI/CD: lint → test (Python services against Postgres/PostGIS + Redis; frontend lint, build, browser
# tests) → images → scan
name: CI/CD Pipeline

on:
  push:
    branches: [main, "echo/*", "claude/*"]
  pull_request:
    branches: [main]

# Jobs get a read-only token unless they ask for more (build: packages, scan: security-events)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/neighboriq-

jobs:
  lint:
    name: Lint (Ruff) & API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.txt
      - name: Ruff
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
      - name: OpenAPI snapshot is current
        run: |
          pip install -r services/api/requirements.txt
          python scripts/export_openapi.py --check

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestion-worker, insights-worker]
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: house_discovery
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U root -d house_discovery" --health-interval 5s --health-retries 10
      redis:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/house_discovery
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/neighboriq_migration_test
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      SECURE_COOKIES: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt alembic pytest-cov
      - name: Migrate
        run: alembic -c migrations/alembic.ini upgrade head
      - name: Test
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/${{ matrix.service }}
          DATA_DIR: ${{ github.workspace }}/data
        run: pytest -v --tb=short

  test-shared:
    name: Test shared (analytics, calculator parity, migrations)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: house_discovery
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U root -d house_discovery" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r shared/tests/requirements.txt
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/house_discovery
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/neighboriq_migration_test
          PYTHONPATH: ${{ github.workspace }}
          ALEMBIC_INI: ${{ github.workspace }}/migrations/alembic.ini
        run: pytest -v --tb=short shared/tests

  frontend:
    name: Frontend lint, build & browser tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:palette
      - run: npm run build
      - name: Browser tests (Playwright, 1440×900 + iPhone 14)
        env:
          CI_NETWORK: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  build:
    name: Build image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [test, test-shared, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: services/api/Dockerfile }
          - { image: ingestion-worker, dockerfile: services/ingestion-worker/Dockerfile }
          - { image: insights-worker, dockerfile: services/insights-worker/Dockerfile }
          - { image: frontend, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image }}
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan each pushed image for known OS and package vulnerabilities. Grype (Anchore), not Trivy:
  # trivy-action tags were compromised in March 2026 (see CHANGELOG, Security).
  scan:
    name: Scan image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, ingestion-worker, insights-worker, frontend]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image }}:sha-${{ github.sha }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: sarif
      - if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: image-${{ matrix.image }}

  audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/package-lock.json
      - name: Python (PyPA advisory database)
        run: |
          pip install -r requirements-dev.txt
          for req in services/api/requirements.txt services/ingestion-worker/requirements.txt \
                     services/insights-worker/requirements.txt shared/tests/requirements.txt; do
            echo "::group::$req"; pip-audit --strict -r "$req"; echo "::endgroup::"
          done
      - name: npm (frontend, docs)
        run: |
          (cd frontend && npm audit --audit-level=moderate)
          (cd docs && npm audit --audit-level=moderate)
