# CI/CD: lint → test (Python services against Postgres/PostGIS + Redis, frontend build) → images → scan
name: CI/CD Pipeline

on:
  push:
    branches: [main, "echo/*", "claude/*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/neighboriq-

jobs:
  lint:
    name: Lint (Ruff) & API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: OpenAPI snapshot is current
        run: |
          pip install -r services/api/requirements.txt
          python scripts/export_openapi.py --check

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestion-worker, insights-worker]
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: house_discovery
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U root" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/house_discovery
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/neighboriq_migration_test
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      SECURE_COOKIES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt alembic pytest-cov
      - name: Migrate
        run: alembic -c migrations/alembic.ini upgrade head
      - name: Test
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/${{ matrix.service }}
          DATA_DIR: ${{ github.workspace }}/data
        run: pytest -v --tb=short

  test-shared:
    name: Test shared (analytics, calculator parity, migrations)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: house_discovery
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U root" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r shared/tests/requirements.txt
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/house_discovery
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://root:root@localhost:5432/neighboriq_migration_test
          PYTHONPATH: ${{ github.workspace }}
          ALEMBIC_INI: ${{ github.workspace }}/migrations/alembic.ini
        run: pytest -v --tb=short shared/tests

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    name: Build image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [test, test-shared, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: services/api/Dockerfile }
          - { image: ingestion-worker, dockerfile: services/ingestion-worker/Dockerfile }
          - { image: insights-worker, dockerfile: services/insights-worker/Dockerfile }
          - { image: frontend, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
