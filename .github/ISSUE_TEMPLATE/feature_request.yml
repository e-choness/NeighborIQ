name: Feature request
description: Something that would help you evaluate a property
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The decision you are trying to make
      description: What are you trying to find out about a property or area, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A number, a view, a filter… and where the data for it could come from.
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
