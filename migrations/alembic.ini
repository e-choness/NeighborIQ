[alembic]
# DATABASE_URL overrides sqlalchemy.url (see env.py)
script_location = migrations/alembic
# Files are named after the revision id: `revision --rev-id 0003_short_name -m "…"`
file_template = %%(rev)s
sqlalchemy.url = postgresql+psycopg2://root:root@postgres:5432/house_discovery

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
